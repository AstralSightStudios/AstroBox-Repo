name: Resource catalog

on:
  pull_request:
    paths:
      - "tmp/**"
  # 删除申请需要仓库 token 自动合入；pull_request_target 使用默认分支上的
  # workflow/script，且不 checkout PR 代码，避免执行贡献者提交的内容。
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "tmp/**"
  # 创作者无法自己重开被维护者关闭的 PR，改为发 [ABCC_REOPEN] 评论请求仓库代劳。
  issue_comment:
    types: [created]
  push:
    branches:
      - main
    paths:
      - "tmp/**"
      - "index_v2.csv"
      - ".github/scripts/resource_submissions.py"
      - ".github/workflows/resource-submissions.yml"
  workflow_dispatch:

concurrency:
  group: resource-submissions-apply
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate resource submission PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/resource_submissions.py validate-pr

  auto-apply-delete:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    # 删除申请串行处理，避免两个删除 PR 同时改同一行目录；单个 job 只做 API
    # 校验与合并，不执行 PR 里的任何代码。
    concurrency:
      group: resource-delete-apply
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      # 合并动作由 GITHUB_TOKEN 完成，push 不会触发新 workflow；显式派发
      # apply-pending 需要 actions: write。
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          sparse-checkout: .github/scripts
          filter: blob:none
      - name: Validate and apply delete submission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/resource_submissions.py auto-apply-delete

  apply-pending:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Apply pending resource submissions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/resource_submissions.py apply-pending

  reopen-on-request:
    # 创作者（对组织仓库没有写权限）无法自己重开 PR，只能发评论请求；
    # 这里用仓库自身的 GITHUB_TOKEN 代为重开，避免同一资源反复新建 PR。
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '[ABCC_REOPEN]')
    runs-on: ubuntu-latest
    # 覆盖工作流级 concurrency，避免排在耗时的 apply-pending 后面。
    concurrency:
      group: resource-submissions-reopen
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          # 这个 job 只需要 .github/scripts 下的脚本，而仓库包体很大
          # （正式仓库实测 .git 108MB），全量 checkout 是整条链路里最慢的一步。
          # 稀疏 + blob 过滤后只拉脚本目录，实测体积 108MB → 248KB、耗时约 5.6 倍差距。
          sparse-checkout: .github/scripts
          filter: blob:none
      - name: Reopen pull request on creator request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/resource_submissions.py reopen-on-request
